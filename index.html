<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laestrygon</title>
<style>
  :root {
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0b0d10;
    color: #e6e8eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 24px;
  }

  h1 {
    font-size: clamp(2.5rem, 6vw, 4rem);
    letter-spacing: 0.02em;
    margin: 0 0 12px;
  }

  p.tagline {
    font-size: clamp(1rem, 2vw, 1.25rem);
    color: #9aa0a6;
    margin: 0 0 40px;
  }

  footer {
    position: fixed;
    bottom: 24px;
    font-size: 0.85rem;
    color: #5f6368;
  }
</style>
</head>
<body>
  <h1>Laestrygon</h1>
  <p class="tagline">Software, built well.</p>
  <footer>&copy; 2026 Laestrygon</footer>
</body>
</html>
